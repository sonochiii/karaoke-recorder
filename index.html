<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GarageBand Style Karaoke & Voice Recorder</title>
    <style>
        body { font-family: sans-serif; background: #121212; color: #e0e0e0; margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; }
        .container { width: 100%; max-width: 650px; background: #1e1e1e; padding: 24px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.5); }
        h1 { font-size: 1.4rem; margin-bottom: 20px; text-align: center; color: #fff; }
        
        /* タブ切り替えボタンのスタイル */
        .tabs { display: flex; gap: 10px; margin-bottom: 20px; }
        .tab-btn { flex: 1; padding: 10px; background: #2d2d2d; border: none; color: #aaa; font-weight: bold; border-radius: 6px; cursor: pointer; }
        .tab-btn.active { background: #6200ee; color: white; }

        /* ビュー（画面）の切り替え用クラス */
        .view { display: none; }
        .view.active { display: block; }

        .section { margin-bottom: 20px; background: #252525; padding: 15px; border-radius: 8px; }
        label { display: block; margin-bottom: 6px; font-weight: bold; font-size: 0.9rem; }
        input[type="file"], input[type="range"] { width: 100%; margin-bottom: 10px; }
        button { background: #6200ee; color: white; border: none; padding: 10px 16px; border-radius: 6px; font-size: 0.95rem; cursor: pointer; width: 100%; margin-top: 6px; font-weight: bold; }
        button:hover { background: #3700b3; }
        button:disabled { background: #444; color: #777; cursor: not-allowed; }
        audio { width: 100%; margin-top: 10px; }
        .status-text { color: #03dac6; font-size: 0.9rem; margin-top: 5px; }
    </style>
</head>
<body>

<div class="container">
    <h1>GarageBand風 歌ってみたレコーダー</h1>
    
    <!-- タブ切り替えボタン -->
    <div class="tabs">
        <button class="tab-btn active" onclick="switchTab('record')">1. 録音・オケ設定</button>
        <button class="tab-btn" onclick="switchTab('edit')">2. 編集・ミックス</button>
    </div>

    <!-- View 1: 録音画面 -->
    <div id="recordView" class="view active">
        <div class="section">
            <label for="audioFile">カラオケ音源ファイル (WAV/MP3)</label>
            <input type="file" id="audioFile" accept="audio/*">
            <div id="fileStatus" class="status-text">音源ファイルが未選択です</div>
            
            <label for="pitchShift" style="margin-top: 15px;">キー変更 (半音単位): <span id="pitchVal">0</span></label>
            <input type="range" id="pitchShift" min="-12" max="12" value="0" step="1">
        </div>

        <div class="section">
            <label>マイク同時レコーディング</label>
            <button id="recordBtn" disabled>オケを聴きながら歌声を録音開始</button>
            <button id="stopRecordBtn" disabled>録音停止</button>
            <div id="recStatus" class="status-text">待機中</div>
        </div>
    </div>

    <!-- View 2: 編集画面 -->
    <div id="editView" class="view">
        <div class="section">
            <label>トラック・ミキシング</label>
            <div id="editStatus" class="status-text">未録音のデータがあります。録音を完了させてください。</div>
            <button id="mixBtn" disabled>音源と歌声をミックスして書き出し</button>
        </div>

        <div class="section">
            <label>ミックス音声プレビュー</label>
            <audio id="audioPreview" controls></audio>
        </div>
    </div>
</div>

<script>
    // タブ切り替え関数
    function switchTab(tabName) {
        document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
        document.querySelectorAll('.view').forEach(view => view.classList.remove('active'));

        if (tabName === 'record') {
            document.querySelectorAll('.tab-btn')[0].classList.add('active');
            document.getElementById('recordView').classList.add('active');
        } else if (tabName === 'edit') {
            document.querySelectorAll('.tab-btn'][1].classList.add('active');
            document.getElementById('editView').classList.add('active');
        }
    }

    // DOM要素の取得
    const audioFileInput = document.getElementById('audioFile');
    const pitchShiftInput = document.getElementById('pitchShift');
    const pitchValSpan = document.getElementById('pitchVal');
    const recordBtn = document.getElementById('recordBtn');
    const stopRecordBtn = document.getElementById('stopRecordBtn');
    const mixBtn = document.getElementById('mixBtn');
    const audioPreview = document.getElementById('audioPreview');
    const fileStatus = document.getElementById('fileStatus');
    const recStatus = document.getElementById('recStatus');
    const editStatus = document.getElementById('editStatus');

    let audioCtx = null;
    let audioBuffer = null;
    let mediaRecorder = null;
    let recordedChunks = [];
    let micStream = null;
    let recordedAudioBlob = null;
    let processedKaraokeBuffer = null;

    pitchShiftInput.addEventListener('input', (e) => {
        pitchValSpan.textContent = e.target.value;
    });

    audioFileInput.addEventListener('change', async (e) => {
        const file = e.target.files[0];
        if (!file) return;

        try {
            fileStatus.textContent = '読み込み中...';
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            const arrayBuffer = await file.arrayBuffer();
            audioBuffer = await audioCtx.decodeAudioData(arrayBuffer);
            recordBtn.disabled = false;
            fileStatus.textContent = `読込完了: ${file.name}`;
        } catch (err) {
            fileStatus.textContent = '音声ファイルの読み込みに失敗しました。';
            console.error(err);
        }
    });

    recordBtn.addEventListener('click', async () => {
        if (!audioBuffer) return;
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();

        try {
            micStream = await navigator.mediaDevices.getUserMedia({ audio: true });
            mediaRecorder = new MediaRecorder(micStream);
            recordedChunks = [];

            mediaRecorder.ondataavailable = (event) => {
                if (event.data.size > 0) recordedChunks.push(event.data);
            };

            mediaRecorder.onstop = async () => {
                recordedAudioBlob = new Blob(recordedChunks, { type: 'audio/webm' });
                mixBtn.disabled = false;
                editStatus.textContent = '録音データの準備ができました。「ミックスして書き出し」を実行してください。';
                recStatus.textContent = '録音完了！編集タブに移動できます。';
                
                // 録音終了時に自動で編集画面へ切り替え
                switchTab('edit');
            };

            const semitones = parseInt(pitchShiftInput.value);
            const playbackRate = Math.pow(2, semitones / 12);

            const offlineCtx = new OfflineAudioContext(
                audioBuffer.numberOfChannels,
                audioBuffer.length / playbackRate,
                audioBuffer.sampleRate
            );
            const source = offlineCtx.createBufferSource();
            source.buffer = audioBuffer;
            source.playbackRate.value = playbackRate;
            source.connect(offlineCtx.destination);
            source.start(0);
            processedKaraokeBuffer = await offlineCtx.startRendering();

            const karaokeSource = audioCtx.createBufferSource();
            karaokeSource.buffer = processedKaraokeBuffer;
            karaokeSource.connect(audioCtx.destination);

            mediaRecorder.start();
            karaokeSource.start(0);

            recordBtn.disabled = true;
            stopRecordBtn.disabled = false;
            recStatus.textContent = '🔴 録音中（オケ再生中）...';

        } catch (err) {
            alert('マイクへのアクセスが拒否されました。');
            console.error(err);
        }
    });

    stopRecordBtn.addEventListener('click', () => {
        if (mediaRecorder && mediaRecorder.state !== 'inactive') {
            mediaRecorder.stop();
        }
        if (micStream) {
            micStream.getTracks().forEach(track => track.stop());
        }
        recordBtn.disabled = false;
        stopRecordBtn.disabled = true;
    });

    mixBtn.addEventListener('click', async () => {
        if (!processedKaraokeBuffer || !recordedAudioBlob) return;

        mixBtn.textContent = 'ミックス中...';
        mixBtn.disabled = true;

        try {
            const micArrayBuffer = await recordedAudioBlob.arrayBuffer();
            const micAudioBuffer = await audioCtx.decodeAudioData(micArrayBuffer);

            const length = Math.max(processedKaraokeBuffer.length, micAudioBuffer.length);
            const numberOfChannels = Math.max(processedKaraokeBuffer.numberOfChannels, micAudioBuffer.numberOfChannels);

            const offlineCtx = new OfflineAudioContext(numberOfChannels, length, audioCtx.sampleRate);

            const karaokeNode = offlineCtx.createBufferSource();
            karaokeNode.buffer = processedKaraokeBuffer;
            karaokeNode.connect(offlineCtx.destination);
            karaokeNode.start(0);

            const micNode = offlineCtx.createBufferSource();
            micNode.buffer = micAudioBuffer;
            micNode.connect(offlineCtx.destination);
            micNode.start(0);

            const mixedBuffer = await offlineCtx.startRendering();
            const wavBlob = bufferToWave(mixedBuffer, mixedBuffer.length);

            audioPreview.src = URL.createObjectURL(wavBlob);
            mixBtn.textContent = 'ミックスして書き出し';
            mixBtn.disabled = false;
            editStatus.textContent = '✨ ミックスが完了しました！下部のプレイヤーから再生・ダウンロードできます。';

        } catch (err) {
            alert('ミックス処理中にエラーが発生しました。');
            console.error(err);
            mixBtn.textContent = 'ミックスして書き出し';
            mixBtn.disabled = false;
        }
    });

    function bufferToWave(abuffer, len) {
        let numOfChan = abuffer.numberOfChannels,
            length = len * numOfChan * 2 + 44,
            buffer = new ArrayBuffer(length),
            view = new DataView(buffer),
            channels = [], sample,
            offset = 0,
            pos = 0;

        function setUint16(data) { view.setUint16(pos, data, true); pos += 2; }
        function setUint32(data) { view.setUint32(pos, data, true); pos += 4; }

        setUint32(0x46464952); // "RIFF"
        setUint32(length - 8);
        setUint32(0x45564157); // "WAVE"

        setUint32(0x20746d66); // "fmt "
        setUint32(16);
        setUint32(1);
        setUint16(numOfChan);
        setUint32(abuffer.sampleRate);
        setUint32(abuffer.sampleRate * 2 * numOfChan);
        setUint16(numOfChan * 2);
        setUint16(16);

        setUint32(0x61746164); // "data"
        setUint32(length - pos - 4);

        for (let i = 0; i < abuffer.numberOfChannels; i++) channels.push(abuffer.getChannelData(i));

        while (pos < length) {
            for (let i = 0; i < numOfChan; i++) {
                sample = Math.max(-1, Math.min(1, channels[i][offset]));
                sample = (0.5 + sample < 0 ? sample * 32768 : sample * 32767);
                view.setInt16(pos, sample, true);
                pos += 2;
            }
            offset++;
        }
        return new Blob([buffer], { type: "audio/wav" });
    }
</script>

</body>
</html>
